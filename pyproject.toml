[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "neqo-qcsd-lab"
version = "0.1.0"
description = "Reproducible live HTTP/3 QCSD capture and visualization"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Kai Sequeira" }]
dependencies = [
  "matplotlib==3.10.3",
  "numpy==2.2.6",
  "PyYAML==6.0.2",
  "scipy==1.17.1",
]

[project.optional-dependencies]
discovery = ["playwright==1.57.0"]
evaluation = ["scikit-learn==1.9.0"]
test = ["dpkt==1.9.8", "pytest==8.4.0"]

[project.scripts]
qcsd-lab-internal = "qcsd_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qcsd_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
