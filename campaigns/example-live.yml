schema_version: 1
name: example-live
master_seed: 20260716
repetitions: 1
timeout_seconds: 60
max_response_bytes: 8388608
capture_duration_seconds: 75
capture_filesize_mb: 128
inter_run_delay_seconds: 3
keep_raw: false
export_pcap: false
interface: eth0

workloads:
  - name: example
    manifest: ../workloads/example-v1.json

defenses:
  - name: none
    config: defenses/none.toml
  - name: static
    config: defenses/static-short.toml
  - name: front
    config: defenses/front-conservative.toml
  - name: tamaraw
    config: defenses/tamaraw-conservative.toml

plotting:
  paper_filter: true
  bin_ms: 50
