name: p4-defense-migration-pilot
seed: 20260730
stage: acceptance
qcsd_profile: live

workloads:
  root: ../workloads
  scope: as-defined
  request_policy: as-defined
  source: live
  reviewed: true
  monitored:
    cloudflare-quiche: 1
    chromium-quic-page: 1
  unmonitored: {}

limits:
  timeout_seconds: 120
  max_response_bytes: 1048576
  capture_seconds: 180
  capture_megabytes: 64
  max_attempts: 3
  per_origin_cooldown_seconds: 30
  inter_sample_seconds: 0
  settle_seconds: 1

defenses:
  - undefended
  - name: static
    kind: static
    schedule: ../defense-params/static-migration.csv
    mode: chaff-only
  - front
  - tamaraw
  - name: traffic-morphing
    kind: traffic_morphing
    parameters: ../defense-params/traffic-morphing-live.json
    allow_reviewed_fixture: true
  - name: wtf-pad
    kind: wtf_pad
    parameters: ../defense-params/wtfpad-live.json
    allow_reviewed_fixture: true
  - name: walkie-talkie
    kind: walkie_talkie
    parameters: ../defense-params/walkie-talkie-live.json
    allow_reviewed_fixture: true
