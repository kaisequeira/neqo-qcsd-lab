schema: 1
name: research-classifier-poc5-baseline-10-1200
purpose: evaluation
seed: 2026081510
profile: research-1200

# Five-class proof-of-concept, temporal block 10 of 10. This baseline
# campaign is paired with classifier-poc5-paired-10.yml.
workloads:
  nghttp2-ngtcp2-r3: 20
  getbootstrap-home-r3: 20
  apache-traffic-server-docs-r3: 20
  nginx-quic-r3: 20
  cloudflare-quiche-r3: 20

request_policies:
  - as-defined

defenses:
  - undefended

limits:
  timeout_seconds: 120
  max_response_bytes: 1048576
  capture_seconds: 180
  capture_megabytes: 64
  max_attempts: 3
  per_origin_cooldown_seconds: 30
  settle_seconds: 1
