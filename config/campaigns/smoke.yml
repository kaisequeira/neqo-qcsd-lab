schema: 1
name: research-smoke-1200
purpose: evaluation
seed: 2026081204
profile: research-1200

# One small graph and one larger documentation graph exercise independent
# post-fitting Internet visits. Each expands to one visit under all seven modes.
workloads:
  cloudflare-quiche-r3: 1
  apache-traffic-server-docs-r3: 1

request_policies:
  - as-defined

defenses:
  - undefended
  - name: static-control
    kind: static
    schedule: ../defense-params/static-control-1200.csv
    mode: chaff-only
  - front
  - tamaraw
  - name: traffic-morphing
    kind: traffic_morphing
    parameters: ../../artifacts/research-1200/traffic-morphing.json
  - name: wtf-pad
    kind: wtf_pad
    parameters: ../../artifacts/research-1200/wtf-pad.json
  - name: walkie-talkie
    kind: walkie_talkie
    parameters: ../../artifacts/research-1200/walkie-talkie.json

limits:
  timeout_seconds: 120
  max_response_bytes: 1048576
  capture_seconds: 180
  capture_megabytes: 64
  max_attempts: 3
  per_origin_cooldown_seconds: 30
  settle_seconds: 1
