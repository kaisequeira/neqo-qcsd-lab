schema: 1
name: consolidated-smoke
purpose: smoke
seed: 20260806
profile: live

# One simple origin and one prepared multi-resource graph exercise the same
# collection path. Each workload expands to one visit under all seven modes.
workloads:
  cloudflare-quiche: 1
  chromium-quic-page: 1

request_policies:
  - as-defined

defenses:
  - undefended
  - name: static-control
    kind: static
    schedule: ../defense-params/static-control-1200.csv
    mode: chaff-only
  - front
  - tamaraw
  - name: traffic-morphing
    kind: traffic_morphing
    parameters: ../defense-params/traffic-morphing-live.json
  - name: wtf-pad
    kind: wtf_pad
    parameters: ../defense-params/wtfpad-live.json
  - name: walkie-talkie
    kind: walkie_talkie
    parameters: ../defense-params/walkie-talkie-live.json

limits:
  timeout_seconds: 120
  max_response_bytes: 1048576
  capture_seconds: 180
  capture_megabytes: 64
  max_attempts: 3
  per_origin_cooldown_seconds: 30
  settle_seconds: 1
