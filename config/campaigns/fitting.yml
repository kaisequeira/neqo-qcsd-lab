schema: 1
name: research-fitting-1200
purpose: fitting
seed: 2026081201
profile: research-1200

# Six independently prepared, immutable workload definitions. Each workload
# is visited ten times under both policies; only natural undefended traffic is
# collected for fitting.
workloads:
  getbootstrap-home-r2: 10
  teamviewer-account-r2: 10
  behance-home-r2: 10
  cloudflare-quiche-r2: 10
  nghttp2-ngtcp2-r2: 10
  chromium-quic-page-r2: 10

request_policies:
  - as-defined
  - half-duplex

defenses:
  - undefended

limits:
  timeout_seconds: 120
  max_response_bytes: 1048576
  capture_seconds: 180
  capture_megabytes: 64
  max_attempts: 3
  per_origin_cooldown_seconds: 30
  settle_seconds: 1
